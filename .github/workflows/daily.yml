name: Daily LinkedIn Post

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST  -> generate draft
    - cron: "30 3 * * *"   # 09:00 IST  -> publish (unless /skip)
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        options: [generate, publish, both]
        default: generate

permissions:
  contents: write

concurrency:
  group: linkedin-post
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide action
        id: act
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
              echo "action=generate" >> "$GITHUB_OUTPUT"
            else
              echo "action=publish" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "action=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          POST_MODE: ${{ vars.POST_MODE || 'review' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python main.py ${{ steps.act.outputs.action }}

      - name: Save state
        if: always()
        run: |
          git config user.name "linkedin-bot"
          git config user.email "linkedin-bot@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet || (git commit -m "state: ${{ steps.act.outputs.action }}" && git push)
